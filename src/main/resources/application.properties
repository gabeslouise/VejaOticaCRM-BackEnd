spring.application.name=CRMVejaOtica

# DataSource - PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/CRMVejaOtica
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# Use 'validate' to ensure mappings match existing schema without modifying it.
# If you prefer Hibernate to alter the schema automatically, set to 'update' instead.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Show SQL in console (formatted)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional: more detailed SQL logging (uncomment to enable)
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
